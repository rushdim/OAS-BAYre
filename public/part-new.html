<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Part · OAS Bay</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="sidebar no-print" id="sidebar"></aside>
  <main class="main">
    <div class="page-header"><h2>Add Part</h2></div>
    <div id="errorBox" class="error-msg" style="display:none;"></div>

    <div class="card">
      <form class="form-box" id="form">
        <div class="form-group">
          <label>Part name</label>
          <input type="text" name="name" required placeholder="e.g. Engine Oil (Premium)" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category" required>
            <option value="">-- Select category --</option>
            <option value="engine_oil">Engine Oil</option>
            <option value="gearbox_oil">Gearbox Oil</option>
            <option value="oil_filter">Oil Filter</option>
            <option value="brake_fluid">Brake Fluid</option>
            <option value="brake_pad">Brake Pad</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Unit price (UGX)</label>
          <input type="number" name="unitPrice" min="0" required />
        </div>
        <div class="form-group">
          <label>Starting stock quantity</label>
          <input type="number" name="stockQty" min="0" value="0" />
        </div>
        <div class="form-group">
          <label>Reorder level (low-stock alert threshold)</label>
          <input type="number" name="reorderLevel" min="0" value="5" />
        </div>
        <button class="btn" type="submit">Save Part</button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async () => {
      const user = await requireAuth(true);
      if (!user) return;

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById("errorBox");
        errorBox.style.display = "none";
        const form = new FormData(e.target);
        try {
          await apiFetch("/api/parts", {
            method: "POST",
            body: JSON.stringify({
              name: form.get("name"),
              category: form.get("category"),
              unitPrice: form.get("unitPrice"),
              stockQty: form.get("stockQty"),
              reorderLevel: form.get("reorderLevel"),
            }),
          });
          window.location.href = "parts.html";
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = "block";
        }
      });
    })();
  </script>
</body>
</html>
