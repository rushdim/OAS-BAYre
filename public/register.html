<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · OAS Bay</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 40px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .toggle-password:hover {
      color: #000;
    }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Create staff account</h1>
      <p class="sub">Registers a "staff" account. Admin accounts are set up separately.</p>
      <div id="errorBox" class="error-msg" style="display:none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" required minlength="6" />
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
              <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" />
            <button type="button" class="toggle-password" data-target="confirmPassword"
              aria-label="Show confirm password">
              <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button id="submitBtn" class="btn" type="submit" style="width:100%;">Register</button>
      </form>

      <div class="switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    if (typeof redirectIfLoggedIn === "function") {
      redirectIfLoggedIn();
    }

    const eyeOpenSVG = `
      <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>`;

    const eyeOffSVG = `
      <svg xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>`;

    document.querySelectorAll(".toggle-password").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.getAttribute("data-target"));
        if (input.type === "password") {
          input.type = "text";
          btn.innerHTML = eyeOffSVG;
        } else {
          input.type = "password";
          btn.innerHTML = eyeOpenSVG;
        }
      });
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("errorBox");
      const submitBtn = document.getElementById("submitBtn");
      errorBox.style.display = "none";

      const form = new FormData(e.target);
      const name = form.get("name").trim();
      const email = form.get("email").trim();
      const password = form.get("password");
      const confirmPassword = form.get("confirmPassword");

      if (password !== confirmPassword) {
        errorBox.textContent = "Passwords do not match.";
        errorBox.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Registering...";

      try {
        const data = await apiFetch("/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, email, password, confirmPassword }),
        });

        if (data && data.token) {
          localStorage.setItem("token", data.token);
        }

        window.location.href = "dashboard.html";
      } catch (err) {
        console.error("Registration error:", err);
        errorBox.textContent = err.message || "Registration failed. Please try again.";
        errorBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
      }
    });
  </script>
</body>

</html>
